# =============================================================================
# SonarQube — analysis settings for this repository.
#
# WHY THIS FILE EXISTS AT ALL, RATHER THAN `-D` ARGUMENTS IN THE WORKFLOW
#
# The SonarScanner CLI reads a file named exactly `sonar-project.properties` from its
# `projectBaseDir`, which is the repository root — so everything below is picked up with
# no wiring. That matters because a `-D` argument OVERRIDES this file: settings stated
# inline in CI silently win over the maintained ones, and local analysis and CI drift
# apart while both appear to be configured. The workflow therefore passes exactly one
# argument, `-Dsonar.projectKey`, and nothing else.
#
# Relative paths below resolve against `projectBaseDir`, which is also where this file
# sits, so they read as ordinary repository paths.
#
# -----------------------------------------------------------------------------
# THIS PROJECT HAS ITS OWN KEY ON THE SERVER, deliberately. On SonarQube Community Build
# a project holds exactly one analysis, so two scanners reporting into one project would
# overwrite each other on every run and the later one would win. The key comes from the
# `SONAR_PROJECT_KEY` repository variable — the same name the sibling
# repositories use, so one server can host all three without them colliding.
#
# -----------------------------------------------------------------------------
# TARGETS SONARQUBE COMMUNITY BUILD. No `sonar.branch.name`, no `sonar.pullrequest.*`.
# Both need Developer Edition or above; on Community they do not degrade gracefully, they
# fail the scan.
# =============================================================================

# --- Project identity --------------------------------------------------------
# The key is NOT set here. It is passed as `-Dsonar.projectKey` from the
# `SONAR_PROJECT_KEY` repository variable, so one clone of this boilerplate
# cannot report into another clone's project by inheriting a committed key.
sonar.projectName=<Your Project> — Frontend
sonar.projectVersion=0.1.0

sonar.sourceEncoding=UTF-8

# Blame-based attribution of new code. Without it, "new code" degrades to a whole-project
# comparison and the gate stops being about your change.
sonar.scm.provider=git

# --- Scope -------------------------------------------------------------------
# `sonar.sources` and `sonar.tests` are both `apps,libs` on purpose. The scanner needs the
# test files in `sonar.tests` to attribute coverage and to apply the test-specific rules,
# and `sonar.test.inclusions` is what actually splits the two sets — anything matching it
# is a test, everything else under the same roots is production code.
sonar.sources=apps,libs
sonar.tests=apps,libs
sonar.test.inclusions=**/*.spec.ts

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/.nx/**,\
  **/.angular/**,\
  **/test-results/**,\
  **/playwright-report/**,\
  **/*.generated.ts,\
  **/api-types/src/lib/types.ts

# The OpenAPI-generated types are excluded above rather than merely ignored: they are
# regenerated from the API's OpenAPI document (ADR-0002), so a finding in them is not
# actionable in this repository — the fix belongs to whoever owns that contract.

# End-to-end specs run against a built application and are covered by the Playwright job,
# not by unit coverage. Counting them here only distorts the ratio.
sonar.coverage.exclusions=\
  **/*.spec.ts,\
  **/apps/web-e2e/**,\
  **/mocks/**,\
  **/environments/**,\
  **/*.config.ts,\
  **/main.ts,\
  **/main.server.ts,\
  **/server.ts

# --- Coverage ----------------------------------------------------------------
# Written by `nx run-many -t test --coverage --coverageReporters=lcov`, relative to
# `projectBaseDir`. If this path is wrong the analysis still succeeds and coverage reports
# as 0%, which then fails the new-code coverage condition for a reason that has nothing to
# do with the tests. Check this first when coverage looks impossible.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# --- Quality gate ------------------------------------------------------------
# Blocks until the server computes the gate, and fails when it fails. Without it the scan
# uploads, the job goes green, and there is effectively no gate. The thresholds live in
# the gate definition on the server, not here.
sonar.qualitygate.wait=true
